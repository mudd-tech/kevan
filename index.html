<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كيفان لاستيراد وتجارة البن الأخضر</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #EAE3D5;
            --surface-card: #F6EFE6; /* مطابق لخلفية اللوجو تماماً */
            --surface-item: #FCF9F5;
            --brand-primary: #23400D; /* الأخضر الداكن من اللوجو */
            --brand-olive: #787C44;   /* الزيتوني من حبة البن */
            --brand-olive-soft: rgba(120, 124, 68, 0.12);
            --text-dark: #1A2611;
            --text-muted: #6E7563;
            --border-subtle: rgba(35, 64, 13, 0.1);
            --border-hover: rgba(35, 64, 13, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            background-image: radial-gradient(circle at 50% 0%, #F6EFE6 0%, #E5DEC9 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--surface-card);
            border: 1px solid rgba(35, 64, 13, 0.08);
            border-radius: 28px;
            padding: 36px 24px 28px;
            box-shadow: 
                0 20px 50px rgba(26, 38, 17, 0.08),
                0 4px 12px rgba(26, 38, 17, 0.04);
            position: relative;
        }

        /* قسم الشعار المتكامل بدون إطار */
        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-box {
            width: 180px;
            height: 95px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* يدمج خلفية الصورة الكريمية مع البطاقة لتبدو شفافة تماماً */
            mix-blend-mode: multiply;
        }

        .subtitle {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            color: var(--brand-primary);
            background: var(--brand-olive-soft);
            padding: 5px 16px;
            border-radius: 100px;
            letter-spacing: 0.2px;
        }

        /* الفروع بتصميم شبكي بسيط */
        .locations-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .location-pill {
            background: var(--surface-item);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .location-pill svg {
            width: 16px;
            height: 16px;
            color: var(--brand-olive);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .loc-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .loc-address {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.35;
        }

        /* عنوان الأقسام */
        .section-label {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            margin: 0 4px 10px;
            display: block;
        }

        /* الأزرار والبطاقات التفاعلية */
        .action-card {
            background: var(--surface-item);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            margin-bottom: 10px;
            transition: all 0.25s ease;
            overflow: hidden;
        }

        .action-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 6px 18px rgba(35, 64, 13, 0.05);
        }

        /* زر الدفع الرئيسي (إنستاباي) */
        .action-card.primary-action {
            background: var(--brand-primary);
            border-color: var(--brand-primary);
        }

        .action-header {
            width: 100%;
            padding: 15px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            border: none;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            text-align: right;
        }

        .action-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--brand-olive-soft);
            color: var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .primary-action .icon-box {
            background: rgba(255, 255, 255, 0.12);
            color: #F6EFE6;
        }

        .icon-box svg {
            width: 20px;
            height: 20px;
        }

        .action-title {
            font-size: 14.5px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .action-sub {
            font-size: 11.5px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .primary-action .action-title {
            color: #F6EFE6;
        }

        .primary-action .action-sub {
            color: rgba(246, 239, 230, 0.7);
        }

        .chevron {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .primary-action .chevron {
            color: rgba(246, 239, 230, 0.8);
        }

        .action-card.open .chevron {
            transform: rotate(180deg);
        }

        /* القوائم المنسدلة الناعمة */
        .accordion-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-card.open .accordion-body {
            grid-template-rows: 1fr;
        }

        .accordion-inner {
            overflow: hidden;
            padding: 0 14px;
        }

        .action-card.open .accordion-inner {
            padding: 4px 14px 14px;
            border-top: 1px solid var(--border-subtle);
        }

        /* صفوف البيانات داخل القائمة */
        .data-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px dashed rgba(35, 64, 13, 0.08);
        }

        .data-row:last-child {
            border-bottom: none;
            padding-bottom: 2px;
        }

        .data-info {
            overflow: hidden;
        }

        .data-label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 2px;
        }

        .data-value {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-dark);
            direction: ltr;
            text-align: right;
            font-variant-numeric: tabular-nums;
            word-break: break-all;
        }

        .copy-btn {
            background: var(--surface-card);
            color: var(--brand-primary);
            border: 1px solid var(--border-subtle);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: var(--brand-primary);
            color: #fff;
            border-color: var(--brand-primary);
        }

        .copy-btn.copied {
            background: var(--brand-primary);
            color: #fff;
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
        }

        /* أزرار التواصل الاجتماعي */
        .social-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

            background: var(--surface-item);
            border: 1px solid var(--border-subtle);
            border-radius:
